background {
    monitor =
    path = ~/myConfig/Arch-dotfiles/wallpaper/evening-sky.png
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(231f20d9)
    inner_color = rgba(01010133)
    font_color = rgba(dededeff)
    fail_color = rgba(ee2e24ff)
    check_color = rgba(d9d8d8ff)
    capslock_color = rgba(009ddcff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%R"
    color = rgba(dededeff)
    font_size = 72
    font_family = Ubuntu Mono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}
