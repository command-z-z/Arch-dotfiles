general {
    grab_focus = true
}

cache {
    # Matches rofi's disable-history: false.
    enabled = true
}

finders {
    # Closest match to rofi's drun mode.
    default_finder = desktop

    # Extra hyprlauncher providers. rofi's run/window/sidebar modes do not have
    # direct hyprlauncher equivalents yet.
    unicode_prefix = .
    math_prefix = =
    font_prefix = '

    # Matches rofi's show-icons: true.
    desktop_icons = true
}

ui {
    # Matches the previous rofi window size.
    window_size = 1200 720
}
