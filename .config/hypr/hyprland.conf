# This is an updated Hyprland config file for the latest version.
#
# Refer to the wiki for more information: https://wiki.hyprland.org

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=HDMI-A-1,2560x1440@60,0x0,1,transform,3
monitor=DP-1,3840x2160@60,auto,1

# Execute your favorite apps at launch
exec-once = fcitx5 & hyprpaper
exec-once = clash
# exec-once = mako
exec-once = swaync
exec-once = hyprctl setcursor catppuccin-frappe-dark-cursors 48
exec-once = waybar
exec-once = eww daemon
exec-once = playerctld daemon
exec-once = bash ~/.config/hypr/scripts/openrgb.sh
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swayidle -w
exec-once = echo "Xft.dpi: 192" | xrdb -merge

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant = 
    kb_model = 
    kb_options = caps:super
    kb_rules = 

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
    }

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.
}

cursor {
    no_hardware_cursors = true
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 8
    gaps_out = 20
    border_size = 4
    col.active_border = 0xffcad3f5
    col.inactive_border = 0xff826fa1

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 11
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    active_opacity = 0.95
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = off
# }

# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Window Rules - Updated to windowrulev2 syntax (v0.41.0+)
# See https://wiki.hyprland.org/Configuring/Window-Rules/
windowrule = match:class ^(kitty)$, workspace 1
windowrule = match:class ^(chrome)$, workspace 2
windowrule = match:class ^(zathura)$, workspace 3
windowrule = match:class ^(Spotify)$, workspace 4
windowrule = match:title ^(Notion Desktop)$, workspace 5
windowrule = match:class ^(QQ)$, workspace 6
windowrule = match:class ^(weixin)$, workspace 6
# windowrule = workspace 1, match:class:^(kitty)$
# windowrule = workspace 2, match:class:^(chrome)$
# windowrule = workspace 3, match:class:^(zathura)$
# windowrule = workspace 4, match:class:^(Spotify)$
# windowrule = workspace 5, match:title:^(Notion Desktop)$
# windowrule = workspace 6, match:class:^(QQ)$
# windowrule = workspace 6, match:class:^(weixin)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$scripts = $HOME/.config/hypr/scripts

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, K, exec, kitty
bind = $mainMod, R, exec, kitty ranger
bind = $mainMod, V, exec, kitty nvim
bind = $mainMod, G, exec, google-chrome-stable
bind = $mainMod, SPACE, exec, rofi -modi run -show run || pkill rofi
bind = $mainMod, B, exec, killall -SIGUSR1 waybar
bind = $mainMod, Q, exec, linuxqq
bind = $mainMod, W, exec, wechat-uos
bind = $mainMod, S, exec, spotify
bind = $mainMod, N, exec, notion-app-enhanced
bind = $mainMod, L, exec, swaylock
bind = $mainMod, D, killactive
bind = $mainMod, M, exit 

bind = ALT_SHIFT, 0, exec, $scripts/snapshot.sh
# binde is deprecated, use bind with a flag instead
bind = , XF86AudioRaiseVolume, exec, $scripts/volume.sh --inc
bind = , XF86AudioLowerVolume, exec, $scripts/volume.sh --dec
bind = , XF86AudioMute, exec, $scripts/volume.sh --toggle 
bind = , XF86KbdBrightnessUp, exec, $scripts/light-on.sh
bind = , XF86KbdBrightnessDown, exec, $scripts/light-off.sh

# Move focus with mainMod + arrow keys
bind = $mainMod SHIFT, H, movefocus, l
bind = $mainMod SHIFT, L, movefocus, r
bind = $mainMod SHIFT, K, movefocus, u
bind = $mainMod SHIFT, J, movefocus, d

# Move window with mainMod + Ctrl + arrow keys
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move active window to a workspace with ALT + SHIFT + [0-9]
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6

# center
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
