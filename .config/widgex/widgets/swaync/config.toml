css = "style.css"

[[sources]]
id = "swaync"
kind = "shell"
mode = "listen"
format = "json"
interval_ms = 500
command = "python3 ./src/notif_daemon.py"

[[windows]]
id = "swaync-panel"
title = "Widgex Notifications"
layer = "top"
anchor = ["top", "right"]
exclusive_zone = 0

[windows.margin]
top = 0
right = 25
bottom = 10

[windows.size]
width = 600
height = 800

# ── root ──
[[windows.widgets]]
type = "box"
direction = "column"
class = ["swaync-panel"]

# ── title ──
[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["swaync-title"]

[[windows.widgets.children.children]]
type = "label"
class = ["swaync-title-text"]
text = " Notifications"

[[windows.widgets.children.children]]
type = "button"
class = ["swaync-clear-btn"]
text = " "

[windows.widgets.children.children.on_click]
type = "command"
command = "/home/eugene/.config/widgex/widgets/swaync/src/notif_ctrl.sh clear"

# ── dnd ──
[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["swaync-dnd"]

[[windows.widgets.children.children]]
type = "label"
class = ["swaync-dnd-text"]
text = "Do Not Disturb"

[[windows.widgets.children.children]]
type = "button"
class = ["swaync-dnd-btn"]
text = "{{ swaync.dnd_label }}"
style = "{{ swaync.dnd_style }}"

[windows.widgets.children.children.on_click]
type = "command"
command = "/home/eugene/.config/widgex/widgets/swaync/src/notif_ctrl.sh toggle-dnd"

# ── quick buttons ──
[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["swaync-buttons"]

[[windows.widgets.children.children]]
type = "button"
class = ["swaync-btn"]
text = ""

[windows.widgets.children.children.on_click]
type = "command"
command = "pavucontrol"

[[windows.widgets.children.children]]
type = "button"
class = ["swaync-btn"]
text = ""

[windows.widgets.children.children.on_click]
type = "command"
command = "nm-connection-editor"

[[windows.widgets.children.children]]
type = "button"
class = ["swaync-btn"]
text = ""

[windows.widgets.children.children.on_click]
type = "command"
command = "blueman-manager"

# ── notifications ──
[[windows.widgets.children]]
type = "box"
direction = "column"
class = ["swaync-notifications"]

# slot 1
[[windows.widgets.children.children]]
type = "box"
direction = "column"
class = ["notif-slot"]
style = "display: {{ swaync.notif_1_display }}; {{ swaync.notif_1_urgent_style }}"

[[windows.widgets.children.children.children]]
type = "box"
direction = "row"
class = ["notif-header"]

[[windows.widgets.children.children.children.children]]
type = "label"
class = ["notif-app"]
text = "{{ swaync.notif_1_app }}"

[[windows.widgets.children.children.children.children]]
type = "label"
class = ["notif-time"]
text = "{{ swaync.notif_1_time }}"

[[windows.widgets.children.children.children.children]]
type = "button"
class = ["notif-close"]
text = "×"

[windows.widgets.children.children.children.children.on_click]
type = "command"
command = "/home/eugene/.config/widgex/widgets/swaync/src/notif_ctrl.sh close-1"

[[windows.widgets.children.children.children]]
type = "label"
class = ["notif-title"]
