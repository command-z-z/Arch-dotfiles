css = "style.css"

[[sources]]
id = "top_bar"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 1000
command = "python3 ./src/top_bar.py"

[[sources]]
id = "hypr_events"
kind = "unix_socket"
mode = "listen"
format = "hyprland_event"
interval_ms = 1000
path = "$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock"

[[windows]]
id = "top-bar"
title = "Widgex Top Bar"
layer = "top"
anchor = ["top", "left", "right"]
exclusive_zone = 32
click_through = false

[windows.size]
height = 32

[[windows.widgets]]
type = "box"
direction = "row"
class = ["top-bar"]

[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["top-bar-left"]

[[windows.widgets.children.children]]
type = "box"
class = ["top-bar-module", "top-bar-launcher"]

[windows.widgets.children.children.on_click]
type = "command"
command = "/home/eugene/Desktop/MyRepo/widgex/target/debug/widgex open --toggle wlogout"

[[windows.widgets.children.children.children]]
type = "label"
class = ["top-bar-inherit-color"]
text = "{{ top_bar.launcher }}"

[[windows.widgets.children.children]]
type = "box"
direction = "row"
class = ["top-bar-workspaces"]

[windows.widgets.children.children.on_scroll_up]
type = "command"
command = "hyprctl dispatch workspace e+1"

[windows.widgets.children.children.on_scroll_down]
type = "command"
command = "hyprctl dispatch workspace e-1"

[[windows.widgets.children.children.children]]
type = "box"
class = ["top-bar-module", "top-bar-workspace"]
style = "{{ top_bar.workspace1_style }}; {{ hypr_events.workspace1_style }}"

[windows.widgets.children.children.children.on_click]
type = "command"
command = "hyprctl dispatch workspace 1"

[[windows.widgets.children.children.children.children]]
type = "label"
class = ["top-bar-inherit-color"]
text = "{{ top_bar.workspace1 }}"

[[windows.widgets.children.children.children]]
type = "box"
class = ["top-bar-module", "top-bar-workspace"]
style = "{{ top_bar.workspace2_style }}; {{ hypr_events.workspace2_style }}"

[windows.widgets.children.children.children.on_click]
type = "command"
command = "hyprctl dispatch workspace 2"

[[windows.widgets.children.children.children.children]]
type = "label"
class = ["top-bar-inherit-color"]
text = "{{ top_bar.workspace2 }}"

[[windows.widgets.children.children.children]]
type = "box"
class = ["top-bar-module", "top-bar-workspace"]
style = "{{ top_bar.workspace3_style }}; {{ hypr_events.workspace3_style }}"

