kind = "shell"
mode = "poll"
format = "json"
interval_ms = 1000
timeout_ms = 15000
command = "python3 -B /home/eugene/.config/widgex/scripts/top_bar.py | python3 -B /home/eugene/.config/widgex/scripts/native_source.py json"

[[sources]]
id = "bar_controls"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 100
timeout_ms = 1000
command = "python3 -B /home/eugene/.config/widgex/scripts/top_bar.py --fast"

[[sources]]
id = "bar_details"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 5000
timeout_ms = 5000
command = "python3 -B /home/eugene/.config/widgex/scripts/top_bar.py --tooltips"

[[sources]]
id = "workspaces_live"
kind = "shell"
mode = "listen"
format = "json"
command = "python3 -B /home/eugene/.config/widgex/scripts/top_bar.py --workspaces-stream"

[[sources]]
id = "notifications_live"
kind = "shell"
mode = "listen"
format = "json"
command = "swaync-client -s | python3 -B /home/eugene/.config/widgex/scripts/native_source.py notifications-live"

[[windows]]
id = "top-bar"
title = "Widgex Top Bar"
layer = "top"
anchor = ["top", "left", "right"]
exclusive_zone = 83
click_through = false

[windows.size]
height = 83

[[windows.widgets]]
type = "center_box"
direction = "row"
class = ["top-bar", "native-top-bar"]

[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["top-bar-left"]

[[windows.widgets.children.children]]
type = "box"
class = ["top-bar-module", "top-bar-launcher"]

[windows.widgets.children.children.on_click]
type = "command"
command = "/home/eugene/.local/bin/widgex open --toggle wlogout"

[[windows.widgets.children.children.children]]
type = "label"
class = ["top-bar-inherit-color"]
text = "{{ top_bar.launcher }}"

[windows.widgets.children.children.children.layout]
text_align = "start"

[windows.widgets.children.children.layout]
valign = "center"

[[windows.widgets.children.children]]
type = "box"
direction = "row"
class = ["top-bar-workspaces"]

[windows.widgets.children.children.on_scroll_up]
type = "command"
command = "hyprctl eval 'hl.dispatch(hl.dsp.focus({workspace=\"e+1\"}))'"

[windows.widgets.children.children.on_scroll_down]
type = "command"
command = "hyprctl eval 'hl.dispatch(hl.dsp.focus({workspace=\"e-1\"}))'"

[[windows.widgets.children.children.children]]
type = "box"
class = ["top-bar-module", "top-bar-workspace"]
style = "{{ workspaces_live.workspace1_style }}"
visible = "{{ workspaces_live.workspace1_visible }}"

[windows.widgets.children.children.children.on_click]
type = "command"
command = "python3 -B /home/eugene/.config/widgex/scripts/top_bar.py --workspace-slot 1"

