css = "style.css"

[[sources]]
id = "weather"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 600000
timeout_ms = 15000
command = "cd /home/eugene/.config/widgex/widgets/weather && python3 ./src/weather.py Dongyang --label 'Dongyang, Zhejiang' | python3 -B /home/eugene/.config/widgex/scripts/native_source.py json"

