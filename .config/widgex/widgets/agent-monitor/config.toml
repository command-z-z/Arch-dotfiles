css = "style.css"

[[sources]]
id = "agent"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 1000
command = "python3 ./src/agent_monitor.py"

[[windows]]
id = "agent-monitor"
title = "AI Agent Monitor"
layer = "background"
anchor = ["top", "left"]
click_through = true

[windows.margin]
top = 1316
left = 24

[windows.size]
width = 420
height = 220

[[windows.widgets]]
type = "box"
direction = "column"
class = ["agent-card"]

[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["agent-header"]

[[windows.widgets.children.children]]
type = "label"
class = ["agent-title"]
text = "{{ agent.title }}"

[[windows.widgets.children.children]]
type = "spacer"

[[windows.widgets.children.children]]
type = "box"
direction = "row"
class = ["agent-pill"]
style = "{{ agent.accent_style }}"

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-pill-dot"]
text = "●"
style = "{{ agent.dot_style }}"

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-pill-text"]
text = "{{ agent.status }}"

[[windows.widgets.children]]
type = "box"
direction = "column"
class = ["agent-hero"]
style = "{{ agent.accent_style }}"

[[windows.widgets.children.children]]
type = "label"
class = ["agent-primary"]
text = "{{ agent.primary }}"

[[windows.widgets.children.children]]
type = "label"
class = ["agent-primary-detail"]
text = "{{ agent.primary_detail }}"

[[windows.widgets.children.children]]
type = "box"
class = ["agent-main-bar"]
style = "{{ agent.bar_style }}"

[[windows.widgets.children]]
type = "box"
class = ["agent-divider"]

[[windows.widgets.children]]
type = "box"
direction = "column"
class = ["agent-rows"]

[[windows.widgets.children.children]]
type = "box"
direction = "row"
class = ["agent-row"]

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-name"]
text = "Claude"

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-state"]
text = "{{ agent.claude_state }}"
style = "{{ agent.claude_style }}"

[[windows.widgets.children.children.children]]
type = "spacer"

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-detail"]
text = "{{ agent.claude_detail }}"

[[windows.widgets.children.children]]
type = "box"
class = ["agent-row-bar"]
style = "{{ agent.claude_bar_style }}"

[[windows.widgets.children.children]]
type = "box"
direction = "row"
class = ["agent-row"]

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-name"]
text = "Codex"

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-state"]
text = "{{ agent.codex_state }}"
style = "{{ agent.codex_style }}"

[[windows.widgets.children.children.children]]
type = "spacer"

[[windows.widgets.children.children.children]]
type = "label"
class = ["agent-detail"]
text = "{{ agent.codex_detail }}"

[[windows.widgets.children.children]]
type = "box"
class = ["agent-row-bar"]
style = "{{ agent.codex_bar_style }}"

[[windows.widgets.children]]
type = "box"
class = ["agent-divider"]

[[windows.widgets.children]]
type = "box"
direction = "row"
class = ["agent-footer"]

[[windows.widgets.children.children]]
type = "label"
class = ["agent-footer-label"]
text = "{{ agent.source }}"

[[windows.widgets.children.children]]
type = "spacer"

[[windows.widgets.children.children]]
type = "label"
class = ["agent-footer-label"]
text = "{{ agent.updated }}"
