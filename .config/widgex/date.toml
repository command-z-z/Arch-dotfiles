[[sources]]
id = "today"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 30000
command = "date '+%a %-d %b' | awk '{printf \"{\\\"weekday\\\":\\\"%s\\\",\\\"day\\\":\\\"%s\\\",\\\"month\\\":\\\"%s\\\"}\\n\", toupper($1), $2, $3}'"
[[windows]]
id = "date"
title = "Date"
layer = "background"
anchor = ["top", "left"]
click_through = true
[windows.margin]
top = 24
left = 254
[windows.size]
width = 190
height = 190
[[windows.widgets]]
type = "box"
direction = "column"
class = ["date-card"]
[[windows.widgets.children]]
type = "label"
class = ["date-weekday"]
text = "{{ today.weekday }}"
[[windows.widgets.children]]
type = "label"
class = ["date-day"]
text = "{{ today.day }}"
[[windows.widgets.children]]
type = "label"
class = ["date-month"]
text = "{{ today.month }}"
