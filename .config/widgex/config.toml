# Widgex native desktop profile. Standard XDG configuration location.
# Clock/date use the background layer so application windows stay above them.
version = 1
modules = ["date.toml", "pet.toml", "widgets/weather/module.toml", "widgets/memo/module.toml", "widgets/sysstat/module.toml", "widgets/agent-monitor/module.toml", "widgets/top-bar/module.toml", "widgets/dashboard/module.toml", "widgets/lyrics_overlay/module.toml", "widgets/wlogout/module.toml"]
[permissions]
allow_shell = true
[theme]
css = "style.css"
[[sources]]
id = "clock_hands"
kind = "shell"
mode = "poll"
format = "json"
interval_ms = 1000
command = "sh /home/eugene/.config/widgex/widgets/clock/src/clock_hands.sh"
[[windows]]
id = "clock"
title = "Clock"
layer = "background"
anchor = ["top", "left"]
click_through = true
[windows.margin]
top = 24
left = 24
[windows.size]
width = 190
height = 190
[[windows.widgets]]
type = "analog_clock"
value = "{{ clock_hands.hour }},{{ clock_hands.minute }},{{ clock_hands.second }}"
